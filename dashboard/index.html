<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>X Brand Intelligence Dashboard</title>
  <link rel="stylesheet" href="styles.css?v=20260526-syntaxfix">
</head>
<body>
  <div id="root">
    <div class="boot-fallback">
      <strong>X Brand Intelligence Dashboard</strong>
      <span>Loading React dashboard...</span>
    </div>
  </div>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script>
    window.addEventListener('error', function (event) {
      var node = document.getElementById('root');
      if (!node) return;
      if (node.textContent && node.textContent.indexOf('Loading React dashboard') === -1) return;
      node.innerHTML = '<div class="boot-error"><strong>Dashboard boot error</strong><span>' + String(event.message || 'Unknown JavaScript error') + '</span><small>Open browser console for details.</small></div>';
    });
  </script>
  <script src="app.js?v=20260526-syntaxfix"></script>
</body>
</html>
