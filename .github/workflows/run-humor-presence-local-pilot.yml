name: Run Local Humor Presence Pilot

on:
  workflow_dispatch:
    inputs:
      pilot_rows:
        description: "Rows to classify for local pilot"
        required: true
        default: "800"
      shard_size:
        description: "Size of each shard"
        required: true
        default: "200"
      max_parallel:
        description: "Maximum parallel shards"
        required: true
        default: "4"
      humor_threshold:
        description: "ML Humor Threshold"
        required: true
        default: "0.70"
      non_humor_threshold:
        description: "ML Non-Humor Threshold"
        required: true
        default: "0.30"
      classifier_version:
        description: "Classifier Version Tag"
        required: true
        default: "local-pilot-v1-github-actions"

permissions:
  contents: write
  actions: read

env:
  PILOT_ROWS: ${{ github.event.inputs.pilot_rows || '800' }}
  SHARD_SIZE: ${{ github.event.inputs.shard_size || '200' }}
  MAX_PARALLEL: ${{ github.event.inputs.max_parallel || '4' }}
  HUMOR_THRESHOLD: ${{ github.event.inputs.humor_threshold || '0.70' }}
  NON_HUMOR_THRESHOLD: ${{ github.event.inputs.non_humor_threshold || '0.30' }}

jobs:
  plan-local-pilot-shards:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Plan Shards
        id: plan
        run: |
          TOTAL=${{ env.PILOT_ROWS }}
          SIZE=${{ env.SHARD_SIZE }}
          NUM_SHARDS=$(( (TOTAL + SIZE - 1) / SIZE ))
          SHARDS=$(seq 1 $NUM_SHARDS | jq -R -s -c 'split("\n")[:-1]')
          echo "shards=$SHARDS" >> $GITHUB_OUTPUT

  classify-local-pilot-shards:
    needs: plan-local-pilot-shards
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: ${{ fromJson(needs.plan-local-pilot-shards.outputs.shards) }}
      max-parallel: 4
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install scikit-learn pandas
      
      - name: Build Samples and Shard
        run: |
          # 1. Build training seed
          python scripts/build_humor_presence_training_seed.py \
            --output data/derived/humor/humor_presence_training_seed.csv

          # 2. Build pilot sample (Total 800)
          # Scaling 60/20/20 to 800 -> 480/160/160
          python scripts/build_humor_presence_pilot_sample.py \
            --output data/derived/humor/humor_presence_local_pilot_sample.csv \
            --fortune-n 480 --wendys-n 160 --moonpie-n 160
          
          # 3. Shard locally for this runner
          START=$(( (${{ matrix.shard }} - 1) * ${{ env.SHARD_SIZE }} ))
          END=$(( ${{ matrix.shard }} * ${{ env.SHARD_SIZE }} ))
          
          head -n 1 data/derived/humor/humor_presence_local_pilot_sample.csv > shard_${{ matrix.shard }}.csv
          tail -n +2 data/derived/humor/humor_presence_local_pilot_sample.csv | sed -n "$((START+1)),${END}p" >> shard_${{ matrix.shard }}.csv

      - name: Classify Shard
        run: |
          python scripts/classify_humor_presence_local.py \
            --input shard_${{ matrix.shard }}.csv \
            --output data/derived/humor/humor_presence_local_pilot_results_shard_${{ matrix.shard }}.csv \
            --training-seed data/derived/humor/humor_presence_training_seed.csv \
            --cues config/humor_presence_rule_cues.json

      - name: Upload Shard Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pilot-shard-${{ matrix.shard }}
          path: data/derived/humor/humor_presence_local_pilot_results_shard_${{ matrix.shard }}.csv

  aggregate-local-pilot-results:
    needs: classify-local-pilot-shards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download all shards
        uses: actions/download-artifact@v4
        with:
          path: shards
          pattern: pilot-shard-*
          merge-multiple: true

      - name: Aggregate
        run: |
          OUT="data/derived/humor/humor_presence_local_pilot_results.csv"
          first=true
          for f in shards/*.csv; do
            if [ "$first" = true ]; then
              cat "$f" > "$OUT"
              first=false
            else
              tail -n +2 "$f" >> "$OUT"
            fi
          done

      - name: Upload Aggregated Results
        uses: actions/upload-artifact@v4
        with:
          name: humor-presence-local-pilot-aggregated
          path: data/derived/humor/humor_presence_local_pilot_results.csv

  evaluate-local-pilot-results:
    needs: aggregate-local-pilot-results
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Download Aggregated Results
        uses: actions/download-artifact@v4
        with:
          name: humor-presence-local-pilot-aggregated
          path: data/derived/humor/

      - name: Evaluate
        run: |
          python scripts/evaluate_humor_presence_local_pilot.py \
            --input data/derived/humor/humor_presence_local_pilot_results.csv \
            --output-audit data/audit/humor_presence_local_pilot_audit_summary.csv \
            --output-review-sample data/audit/humor_presence_local_pilot_review_sample.csv \
            --output-diagnosis data/audit/humor_presence_local_pilot_ambiguous_diagnosis.csv \
            --mode pilot \
            --sample-size ${{ env.PILOT_ROWS }} \
            --humor-threshold ${{ env.HUMOR_THRESHOLD }} \
            --non-humor-threshold ${{ env.NON_HUMOR_THRESHOLD }}

      - name: Upload Evaluation Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: humor-presence-local-pilot-evaluation
          path: |
            data/audit/humor_presence_local_pilot_audit_summary.csv
            data/audit/humor_presence_local_pilot_review_sample.csv
            data/audit/humor_presence_local_pilot_ambiguous_diagnosis.csv
