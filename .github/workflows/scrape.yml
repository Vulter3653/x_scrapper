name: Daily X Scraper

on:
  schedule:
    - cron: '0 0 * * *' # 매일 자정(UTC)에 실행
  workflow_dispatch: # 수동 실행 버튼 활성화

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install twikit

      - name: Run Scraper
        env:
          X_USERNAME: ${{ secrets.X_USERNAME }}
          X_EMAIL: ${{ secrets.X_EMAIL }}
          X_PASSWORD: ${{ secrets.X_PASSWORD }}
          TARGET_USER: 'Wendys'
        run: python scrape_x.py

      - name: Commit and Push results
        run: |
          set -x  # 실행되는 모든 명령어를 로그에 출력 (디버깅용)
          
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 파일 추가 (결과 JSON 및 쿠키)
          git add -A
          git add -f cookies.json || true
          
          # 변경 사항이 있는지 확인 후 커밋 및 푸시
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Update scraped data [skip ci]"
            # 토큰을 URL에 명시적으로 포함하여 푸시 (권한 문제 원천 차단)
            git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:main
          else
            echo "No changes to commit"
          fi
