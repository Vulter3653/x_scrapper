name: Daily X Scraper

on:
  schedule:
    - cron: '0 0 * * *' # 매일 자정(UTC)에 실행
  workflow_dispatch: # 수동 실행 버튼 활성화

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install twikit

      - name: Run Scraper
        env:
          X_USERNAME: ${{ secrets.X_USERNAME }}
          X_EMAIL: ${{ secrets.X_EMAIL }}
          X_PASSWORD: ${{ secrets.X_PASSWORD }}
          TARGET_USER: 'Wendys'
        run: python scrape_x.py

      - name: Commit and Push results
        run: |
          # Git 보안 설정 (128 에러 해결책)
          git config --global --add safe.directory /github/workspace
          
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 변경사항 확인 및 커밋
          git add -A
          # cookies.json 등 무시된 파일이 있을 수 있으므로 강제 추가 시도
          git add -f cookies.json || echo "No cookies.json"
          
          if git diff-index --quiet HEAD --; then
            echo "No changes to commit"
          else
            git commit -m "Update scraped data [skip ci]"
            git push origin main
          fi
