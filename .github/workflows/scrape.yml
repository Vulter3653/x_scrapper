name: Scrape X Posts

on:
  workflow_dispatch:
    inputs:
      target_user:
        description: 'X screen name to scrape'
        required: true
        default: 'Wendys'
      max_scrolls:
        description: 'Maximum browser scroll attempts'
        required: true
        default: '2500'
      scroll_delay_seconds:
        description: 'Delay after each scroll'
        required: true
        default: '1.25'
      idle_scroll_limit:
        description: 'Stop after this many scrolls without new posts'
        required: true
        default: '60'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-scrape.txt
          python -m playwright install --with-deps chromium

      - name: 4. Validate scraper secrets
        shell: bash
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${X_AUTH_TOKEN:-}" ]; then
            echo "::error title=Missing secret::Repository secret X_AUTH_TOKEN is empty or not configured."
            missing=1
          fi
          if [ -z "${X_CT0:-}" ]; then
            echo "::error title=Missing secret::Repository secret X_CT0 is empty or not configured."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Required X cookie secrets are configured."

      - name: 5. Run scraper
        shell: bash
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          TARGET_USER: ${{ inputs.target_user }}
          MAX_SCROLLS: ${{ inputs.max_scrolls }}
          SCROLL_DELAY_SECONDS: ${{ inputs.scroll_delay_seconds }}
          IDLE_SCROLL_LIMIT: ${{ inputs.idle_scroll_limit }}
          HEADLESS: 'true'
        run: |
          set -o pipefail
          python scrape_x.py 2>&1 | tee scraper.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -n 40 scraper.log
            last_error=$(tail -n 1 scraper.log | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error title=Scraper failed::$last_error"
            exit "$status"
          fi
          rm -f scraper.log scraper_failure.log

      - name: 6. Sync dashboard data
        shell: bash
        run: |
          set -euxo pipefail
          python sync_dashboard_data.py

      - name: 7. Inspect changed files
        shell: bash
        run: |
          set -euxo pipefail
          git status --short

      - name: 8. Commit and push scrape results
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          if [ -z "$(git status --porcelain)" ]; then
            echo 'No changes to commit.'
            exit 0
          fi

          git add -A
          git commit -m "Update scraped X posts for ${{ inputs.target_user }}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push failed on attempt ${attempt}; rebasing onto origin/main and retrying."
            git fetch origin main
            git rebase origin/main
          done

          echo "Failed to push after retries."
          exit 1
