name: Daily X Scraper

on:
  schedule:
    - cron: '0 0 * * *' # 매일 자정(UTC)에 실행
  workflow_dispatch: # 수동 실행 버튼 활성화

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install twikit

      - name: 4. Run Scraper
        id: scraper_step
        env:
          X_USERNAME: ${{ secrets.X_USERNAME }}
          X_EMAIL: ${{ secrets.X_EMAIL }}
          X_PASSWORD: ${{ secrets.X_PASSWORD }}
          TARGET_USER: 'Wendys'
        run: python scrape_x.py

      - name: 5. Commit and Push results
        id: push_step
        run: |
          # Git 보안 설정 (일부 환경에서 128 에러 해결)
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 인증된 리모트 설정
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          
          # 변경된 모든 파일 추가 (결과 JSON, 쿠키 등)
          git add -A
          git add -f cookies.json || true
          
          # 변경 사항이 있는 경우에만 진행
          if ! git diff --staged --quiet; then
            git commit -m "Update scraped data [skip ci]"
            git push origin HEAD:main
          else
            echo "변경사항이 없습니다."
          fi
