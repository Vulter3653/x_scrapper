name: Scrape

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 2. Debug Git environment
        shell: bash
        run: |
          set -euxo pipefail
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          pwd
          ls -la
          git --version
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git status
          git branch --show-current
          git remote -v | sed -E 's#https://[^@]+@github.com/#https://***@github.com/#g'

      - name: 3. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 4. Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 5. Run scraper
        shell: bash
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          TARGET_USER: 'Wendys'
        run: |
          set -euxo pipefail
          python scrape_x.py

      - name: 6. Inspect changed files
        shell: bash
        run: |
          set -euxo pipefail
          git status --short
          git diff --stat || true

      - name: 7. Commit and push changes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit. Exiting successfully."
            exit 0
          fi

          git add -A
          git commit -m "Update scraped data"

          echo "Current branch:"
          git branch --show-current

          echo "Current status:"
          git status

          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git remote -v | sed -E 's#https://[^@]+@github.com/#https://***@github.com/#g'

          git push origin HEAD:main
