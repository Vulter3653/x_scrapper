name: Build CAR Symmetric Event Window Panel

on:
  workflow_dispatch:
    inputs:
      commit_results:
        description: "Commit panel outputs to main (default: artifact only)"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      humor_variables_path:
        description: "Humor firm-period hypothesis variables CSV"
        required: true
        default: "data/derived/humor/hypothesis_variables/humor_firm_period_hypothesis_variables.csv"
      humor_manifest_path:
        description: "Humor hypothesis variables manifest JSON"
        required: true
        default: "data/audit/humor/hypothesis_variables/humor_hypothesis_variables_manifest.json"
      korea_uni_event_dataset_path:
        description: "korea_uni event study dataset (company/ticker/CIK/CAR source)"
        required: true
        default: "data/external/korea_uni/ai_10k_event_study_analysis_dataset.csv"
      daily_abnormal_return_path:
        description: "Optional: daily abnormal return file for CAR_m3_p3 and CAR_m5_p5. Must have columns: ticker, filing_date, event_day, abnormal_return."
        required: false
        default: "data/external/korea_uni/event_window_daily_abnormal_returns.csv"

permissions:
  contents: write

concurrency:
  group: build-car-symmetric-event-window-panel
  cancel-in-progress: false

jobs:
  build-car-panel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify required inputs exist
        run: |
          set -euo pipefail
          for f in \
            '${{ inputs.humor_variables_path }}' \
            '${{ inputs.humor_manifest_path }}' \
            '${{ inputs.korea_uni_event_dataset_path }}'; do
            if [ ! -f "$f" ]; then
              echo "::error title=Missing required input::$f not found."
              exit 1
            fi
            echo "OK: $f ($(wc -l < "$f") lines)"
          done

      - name: Check optional daily abnormal return input
        run: |
          set -euo pipefail
          DAILY_AR='${{ inputs.daily_abnormal_return_path }}'
          if [ -f "${DAILY_AR}" ]; then
            echo "Daily AR file found: ${DAILY_AR} ($(wc -l < "${DAILY_AR}") lines)"
            echo "CAR_m3_p3 and CAR_m5_p5 will be computed from daily abnormal returns."
          else
            echo "::warning title=Daily AR not found::${DAILY_AR} not found."
            echo "CAR_m3_p3 and CAR_m5_p5 will be marked missing."
            echo "To enable: copy event_window_daily_abnormal_returns.csv from korea_uni repo"
            echo "to data/external/korea_uni/ with columns: ticker, filing_date, event_day, abnormal_return"
            echo "Workflow will continue without it."
          fi

      - name: Build CAR symmetric event window panel
        id: build
        run: |
          set -euo pipefail
          DAILY_AR='${{ inputs.daily_abnormal_return_path }}'
          DAILY_ARG=""
          if [ -f "${DAILY_AR}" ]; then
            DAILY_ARG="--daily-ar ${DAILY_AR}"
          fi
          python scripts/build_car_symmetric_event_window_panel.py \
            --korea-event   '${{ inputs.korea_uni_event_dataset_path }}' \
            --humor-vars    '${{ inputs.humor_variables_path }}' \
            --humor-manifest '${{ inputs.humor_manifest_path }}' \
            ${DAILY_ARG} \
            --out-car      data/derived/car_event_windows/car_symmetric_event_window_panel.csv \
            --out-linkage  data/derived/car_event_windows/humor_car_linkage_panel.csv \
            --out-dict     data/derived/car_event_windows/car_window_variable_dictionary.csv \
            --out-manifest data/audit/car_event_windows/car_symmetric_event_window_manifest.json

      - name: Verify outputs and manifest constraints
        run: |
          set -euo pipefail
          for f in \
            data/derived/car_event_windows/car_symmetric_event_window_panel.csv \
            data/derived/car_event_windows/humor_car_linkage_panel.csv \
            data/derived/car_event_windows/car_window_variable_dictionary.csv \
            data/audit/car_event_windows/car_symmetric_event_window_manifest.json; do
            if [ ! -f "$f" ]; then
              echo "::error title=Missing output::$f not found after script run"
              exit 1
            fi
            echo "OK: $f ($(wc -l < "$f") lines)"
          done
          python3 -c "
          import json, sys
          m = json.load(open('data/audit/car_event_windows/car_symmetric_event_window_manifest.json'))

          # Constraint flags — must ALL be false
          forbidden = {
              'car_used_as_tobins_q',
              'car_used_as_direct_brand_equity',
              'regression_run',
              'causal_claim_made',
              'external_data_downloaded',
              'sec_collection_run',
              'market_data_collection_run',
              'x_collection_run',
              'raw_data_modified',
              'humor_outputs_modified',
          }
          violations = [(k, m.get(k)) for k in forbidden if m.get(k)]
          if violations:
              print('CONSTRAINT VIOLATION:', violations, file=sys.stderr)
              sys.exit(1)

          # tobins_q_deferred must be true
          if not m.get('tobins_q_deferred'):
              print('tobins_q_deferred must be true', file=sys.stderr)
              sys.exit(1)

          print('Constraints OK.')
          print(f'car_event_rows:                    {m.get(\"car_event_rows\")}')
          print(f'CAR_m1_p1_available_rows:          {m.get(\"CAR_m1_p1_available_rows\")}')
          print(f'CAR_m3_p3_available_rows:          {m.get(\"CAR_m3_p3_available_rows\")}')
          print(f'CAR_m5_p5_available_rows:          {m.get(\"CAR_m5_p5_available_rows\")}')
          print(f'humor_car_linked_rows:             {m.get(\"humor_car_linked_rows\")}')
          print(f'same_month_alignment_rows:         {m.get(\"same_month_alignment_rows\")}')
          print(f'prefiling_lag_1m_alignment_rows:   {m.get(\"prefiling_lag_1m_alignment_rows\")}')
          print(f'prefiling_lag_3m_alignment_rows:   {m.get(\"prefiling_lag_3m_alignment_rows\")}')
          print(f'join_ready_for_CAR_m1_p1_rows:     {m.get(\"join_ready_for_CAR_m1_p1_rows\")}')
          print(f'join_ready_for_CAR_m3_p3_rows:     {m.get(\"join_ready_for_CAR_m3_p3_rows\")}')
          print(f'join_ready_for_CAR_m5_p5_rows:     {m.get(\"join_ready_for_CAR_m5_p5_rows\")}')
          print(f'future_event_count:                {m.get(\"future_event_count\")}')
          print(f'requires_date_audit:               {m.get(\"requires_date_audit\")}')
          print(f'daily_abnormal_return_available:   {m.get(\"daily_abnormal_return_input_available\")}')
          print(f'tobins_q_deferred:                 {m.get(\"tobins_q_deferred\")}')
          if not m.get('daily_abnormal_return_input_available'):
              print(f'missing_car_reason: {m.get(\"missing_car_reason\", \"\")[:100]}')
          if m.get('requires_date_audit'):
              print(f'::warning title=Date audit required::future_event_count={m.get(\"future_event_count\")}')
          "

      - name: Upload CAR panel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: car-symmetric-event-window-panel
          path: |
            data/derived/car_event_windows/car_symmetric_event_window_panel.csv
            data/derived/car_event_windows/humor_car_linkage_panel.csv
            data/derived/car_event_windows/car_window_variable_dictionary.csv
            data/audit/car_event_windows/car_symmetric_event_window_manifest.json
          retention-days: 30

      - name: Commit CAR panel outputs to main
        if: ${{ inputs.commit_results == 'true' }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add \
            data/derived/car_event_windows/car_symmetric_event_window_panel.csv \
            data/derived/car_event_windows/humor_car_linkage_panel.csv \
            data/derived/car_event_windows/car_window_variable_dictionary.csv \
            data/audit/car_event_windows/car_symmetric_event_window_manifest.json \
            docs/car_symmetric_event_window_panel_plan.md \
            config/car_symmetric_event_window_panel_schema.json
          if git diff --cached --quiet; then
            echo "No CAR panel changes to commit."
            exit 0
          fi
          git commit -m 'data: car symmetric event window panel and humor-car linkage'
          git push origin HEAD:main
