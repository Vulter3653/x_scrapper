name: Append Humor Collection (102 Companies)

on:
  workflow_dispatch:
    inputs:
      max_posts:
        description: 'Maximum posts to collect per account (0 for all)'
        required: true
        default: '0'
      max_scrolls:
        description: 'Maximum scrolls per account'
        required: true
        default: '2500'

permissions:
  contents: write

jobs:
  append-collection:
    runs-on: ubuntu-latest
    timeout-minutes: 600
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-scrape.txt
          python -m playwright install --with-deps chromium

      - name: Run Append Collection
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
        run: |
          python scripts/run_humor_append_collection.py \
            --max-posts ${{ github.event.inputs.max_posts }} \
            --max-scrolls ${{ github.event.inputs.max_scrolls }}

      - name: Commit and Push Results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/raw/fortune_x_2025_ranked/
          git add data/wendys/posts.json
          git add data/cocacola/posts.json
          git add data/moonpie/posts.json
          git add data/audit/humor_collection_append_summary.csv
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Append collected humor posts for 102 targets"
            git push origin HEAD:main
          else
            echo "No new posts collected."
          fi
