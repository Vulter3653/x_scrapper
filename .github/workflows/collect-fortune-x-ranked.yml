            cp "data/audit/fortune_x_2025_ranked_collection_summary_shard_phase_4_rank_${{ matrix.rank }}.csv" staging/data/audit/
          fi

      - name: Upload shard artifact
        uses: actions/upload-artifact@v4
        with:
          name: fortune-x-ranked-phase-4-rank-${{ matrix.rank }}
          path: staging/
          retention-days: 1

  aggregate-ranked-shards:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - collect-phase-1
      - collect-phase-2
      - collect-phase-3
      - collect-phase-4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: fortune-x-ranked-phase-*-rank-*
          path: artifact_downloads
          merge-multiple: true

      - name: Materialize downloaded shard artifacts
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf data/raw/fortune_x_2025_ranked
          mkdir -p data/raw data/audit
          if [ -d artifact_downloads/data/raw/fortune_x_2025_ranked ]; then
            cp -R artifact_downloads/data/raw/fortune_x_2025_ranked data/raw/
          fi
          if [ -d artifact_downloads/data/audit ]; then
            cp artifact_downloads/data/audit/fortune_x_2025_ranked_collection_summary_shard_*.csv data/audit/ || true
          fi

      - name: Merge shard summaries
        shell: bash
        run: |
          set -euxo pipefail
          python scripts/merge_fortune_x_ranked_collection_shards.py             --output data/audit/fortune_x_2025_ranked_collection_summary.csv

      - name: Validate ranked collection outputs
        shell: bash
        run: |
          set -euxo pipefail
          python scripts/validate_fortune_x_ranked_collection.py             --summary-file data/audit/fortune_x_2025_ranked_collection_summary.csv             --expected-start-rank "${{ inputs.start_rank }}"             --expected-end-rank "${{ inputs.end_rank }}"
          if [ -n "$(git status --short dashboard/data)" ]; then
            echo "::error title=dashboard/data changed::dashboard/data must not be modified by ranked collection."
            git status --short dashboard/data
            exit 1
          fi

      - name: Commit and push collection outputs
        if: ${{ inputs.commit_results == 'true' }}
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/fortune_x_2025_ranked data/audit/fortune_x_2025_ranked_collection_summary.csv
          if git diff --cached --quiet; then
            echo "No ranked Fortune X collection output changes to commit."
            exit 0
          fi
          git commit -m "data: collect ranked fortune x posts" -m "Collected capped browser-based collection of observable public posts for the Fortune 2025 ranked queue using phased rank matrix shards. Dashboard data was not synced. Official X API was not used."
          git push origin HEAD:main
