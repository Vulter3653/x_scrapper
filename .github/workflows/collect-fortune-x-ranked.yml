          fi
          if [ -f "data/audit/fortune_x_2025_ranked_collection_summary_shard_phase_2_rank_${{ matrix.rank }}.csv" ]; then
            cp "data/audit/fortune_x_2025_ranked_collection_summary_shard_phase_2_rank_${{ matrix.rank }}.csv" staging/data/audit/
          fi

      - name: Upload shard artifact
        uses: actions/upload-artifact@v4
        with:
          name: fortune-x-ranked-phase-2-rank-${{ matrix.rank }}
          path: staging/
          retention-days: 1

  collect-phase-3:
