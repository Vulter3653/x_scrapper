name: Collect Fortune 2025 Ranked X Accounts

on:
  workflow_dispatch:
    inputs:
      max_posts:
        description: 'Maximum observable public posts per account; use 0 for unbounded scroll-exhaustion collection'
        required: true
        default: '0'
      start_rank:
        description: 'Starting Fortune rank'
        required: true
        default: '1'
      end_rank:
        description: 'Ending Fortune rank'
        required: true
        default: '100'
      max_parallel:
        description: 'Compatibility input retained; stable phased collection runs sequentially'
        required: true
        default: '1'
      retry_attempts:
        description: 'Retry attempts per account after an initial failed browser collection'
        required: true
        default: '2'
      max_scrolls:
        description: 'Maximum browser scroll attempts per account'
        required: true
        default: '2500'
      scroll_delay_seconds:
        description: 'Delay after each scroll'
        required: true
        default: '1.5'
      idle_scroll_limit:
        description: 'Stop after this many scrolls without new posts'
        required: true
        default: '80'
      page_timeout_ms:
        description: 'Profile page and tweet-render timeout in milliseconds'
        required: true
        default: '120000'
      commit_results:
        description: 'Commit and push collection outputs'
        required: true
        default: 'true'

permissions:
  contents: write

concurrency:
  group: fortune-x-ranked-collection
  cancel-in-progress: false

jobs:
  collect-ranked-phases:
    runs-on: ubuntu-latest
    timeout-minutes: 720

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve previous ranked output snapshot
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf .previous_fortune_x_ranked
          if [ -d data/raw/fortune_x_2025_ranked ]; then
            cp -R data/raw/fortune_x_2025_ranked .previous_fortune_x_ranked
          else
            mkdir -p .previous_fortune_x_ranked
          fi

      - name: Prepare stable phased workspace
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf data/raw/fortune_x_2025_ranked
          rm -f data/audit/fortune_x_2025_ranked_collection_summary_shard_*.csv
          mkdir -p data/raw/fortune_x_2025_ranked data/audit staging

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install existing browser collector dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-scrape.txt
          python -m playwright install --with-deps chromium

      - name: Validate ranked collection scaffold before phased run
        shell: bash
        run: |
          set -euxo pipefail
          python scripts/validate_fortune_x_ranked_collection.py --allow-empty-before-run

      - name: Run stable phased ranked Fortune X collection
        shell: bash
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
        run: |
          set -euo pipefail

          run_phase() {
            phase_id="$1"
            phase_start="$2"
            phase_end="$3"
            requested_start=${{ inputs.start_rank }}
            requested_end=${{ inputs.end_rank }}
            actual_start=$(( requested_start > phase_start ? requested_start : phase_start ))
            actual_end=$(( requested_end < phase_end ? requested_end : phase_end ))

            if [ "$actual_start" -gt "$actual_end" ]; then
              echo "phase_${phase_id}_outside_requested_range start=${phase_start} end=${phase_end}"
              return 0
            fi

            echo "phase_${phase_id}_start actual_start=${actual_start} actual_end=${actual_end}"
            python scripts/run_fortune_x_ranked_collection.py \
              --start-rank "$actual_start" \
              --end-rank "$actual_end" \
              --max-posts "${{ inputs.max_posts }}" \
              --retries "${{ inputs.retry_attempts }}" \
              --max-scrolls "${{ inputs.max_scrolls }}" \
              --scroll-delay-seconds "${{ inputs.scroll_delay_seconds }}" \
              --idle-scroll-limit "${{ inputs.idle_scroll_limit }}" \
              --page-timeout-ms "${{ inputs.page_timeout_ms }}" \
              --previous-output-root ".previous_fortune_x_ranked" \
              --summary-file "data/audit/fortune_x_2025_ranked_collection_summary_shard_phase_${phase_id}.csv"
            echo "phase_${phase_id}_complete actual_start=${actual_start} actual_end=${actual_end}"
          }

          run_phase 1 1 25
          run_phase 2 26 50
          run_phase 3 51 75
          run_phase 4 76 100

      - name: Merge phase summaries
        shell: bash
        run: |
          set -euxo pipefail
          python scripts/merge_fortune_x_ranked_collection_shards.py \
            --output data/audit/fortune_x_2025_ranked_collection_summary.csv

      - name: Validate ranked collection outputs
        shell: bash
        run: |
          set -euxo pipefail
          python scripts/validate_fortune_x_ranked_collection.py \
            --summary-file data/audit/fortune_x_2025_ranked_collection_summary.csv \
            --expected-start-rank "${{ inputs.start_rank }}" \
            --expected-end-rank "${{ inputs.end_rank }}"
          if [ -n "$(git status --short dashboard/data)" ]; then
            echo "::error title=dashboard/data changed::dashboard/data must not be modified by ranked collection."
            git status --short dashboard/data
            exit 1
          fi

      - name: Stage collection artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging/data/raw staging/data/audit
          if [ -d data/raw/fortune_x_2025_ranked ]; then
            cp -R data/raw/fortune_x_2025_ranked staging/data/raw/
          fi
          cp data/audit/fortune_x_2025_ranked_collection_summary*.csv staging/data/audit/ || true

      - name: Upload collection artifact
        uses: actions/upload-artifact@v4
        with:
          name: fortune-x-ranked-phased-collection
          path: staging/
          retention-days: 1

      - name: Commit and push collection outputs
        if: ${{ inputs.commit_results == 'true' }}
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/fortune_x_2025_ranked data/audit/fortune_x_2025_ranked_collection_summary.csv
          if git diff --cached --quiet; then
            echo "No ranked Fortune X collection output changes to commit."
            exit 0
          fi
          git commit -m "data: collect ranked fortune x posts" -m "Collected browser-based observable public posts for the Fortune 2025 ranked queue using four stable sequential phases. Dashboard data was not synced. Official X API was not used."
          git push origin HEAD:main
