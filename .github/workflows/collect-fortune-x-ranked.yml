name: Collect Fortune 2025 Ranked X Accounts

on:
  workflow_dispatch:
    inputs:
      max_posts:
        description: 'Maximum observable public posts per account; use 0 for unbounded scroll-exhaustion collection'
        required: true
        default: '0'
      start_rank:
        description: 'Starting Fortune rank'
        required: true
        default: '1'
      end_rank:
        description: 'Ending Fortune rank'
        required: true
        default: '100'
      max_parallel:
        description: 'Maximum shard jobs to run in parallel'
        required: true
        default: '4'
      retry_attempts:
        description: 'Retry attempts per account after an initial failed browser collection'
        required: true
        default: '1'
      max_scrolls:
        description: 'Maximum browser scroll attempts per account'
        required: true
        default: '2500'
      scroll_delay_seconds:
        description: 'Delay after each scroll'
        required: true
        default: '1.25'
      idle_scroll_limit:
        description: 'Stop after this many scrolls without new posts'
        required: true
        default: '60'
      page_timeout_ms:
        description: 'Profile page and tweet-render timeout in milliseconds'
        required: true
        default: '60000'
      commit_results:
        description: 'Commit and push collection outputs'
        required: true
        default: 'true'

permissions:
  contents: write

concurrency:
  group: fortune-x-ranked-collection
  cancel-in-progress: false

jobs:
  collect-ranked-shards:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        shard:
          - id: '01'
            start: 1
            end: 4
          - id: '02'
            start: 5
            end: 8
          - id: '03'
            start: 9
            end: 12
          - id: '04'
            start: 13
            end: 16
          - id: '05'
            start: 17
            end: 20
          - id: '06'
            start: 21
            end: 24
          - id: '07'
            start: 25
            end: 28
          - id: '08'
            start: 29
            end: 32
          - id: '09'
            start: 33
            end: 36
          - id: '10'
            start: 37
            end: 40
          - id: '11'
            start: 41
            end: 44
          - id: '12'
            start: 45
            end: 48
          - id: '13'
            start: 49
            end: 52
          - id: '14'
            start: 53
            end: 56
          - id: '15'
            start: 57
            end: 60
          - id: '16'
            start: 61
            end: 64
          - id: '17'
            start: 65
            end: 68
          - id: '18'
            start: 69
            end: 72
          - id: '19'
            start: 73
            end: 76
          - id: '20'
            start: 77
            end: 80
          - id: '21'
            start: 81
            end: 84
          - id: '22'
            start: 85
            end: 88
          - id: '23'
            start: 89
            end: 92
          - id: '24'
            start: 93
            end: 96
          - id: '25'
            start: 97
            end: 100

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve shard rank range
        id: bounds
        shell: bash
        run: |
          set -euo pipefail
          requested_start=${{ inputs.start_rank }}
          requested_end=${{ inputs.end_rank }}
          shard_start=${{ matrix.shard.start }}
          shard_end=${{ matrix.shard.end }}
          actual_start=$(( requested_start > shard_start ? requested_start : shard_start ))
          actual_end=$(( requested_end < shard_end ? requested_end : shard_end ))
          mkdir -p staging
          if [ "$actual_start" -gt "$actual_end" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "shard_${{ matrix.shard.id }}_outside_requested_range" > "staging/shard_${{ matrix.shard.id }}_skipped.txt"
            exit 0
          fi
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "start_rank=$actual_start" >> "$GITHUB_OUTPUT"
          echo "end_rank=$actual_end" >> "$GITHUB_OUTPUT"

      - name: Preserve previous ranked output snapshot
        if: ${{ steps.bounds.outputs.should_run == 'true' }}
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf .previous_fortune_x_ranked
          if [ -d data/raw/fortune_x_2025_ranked ]; then
            cp -R data/raw/fortune_x_2025_ranked .previous_fortune_x_ranked
          else
            mkdir -p .previous_fortune_x_ranked
          fi

      - name: Prepare isolated shard workspace
        if: ${{ steps.bounds.outputs.should_run == 'true' }}
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf data/raw/fortune_x_2025_ranked
          rm -f data/audit/fortune_x_2025_ranked_collection_summary_shard_*.csv
          mkdir -p data/raw/fortune_x_2025_ranked data/audit staging

      - name: Set up Python
        if: ${{ steps.bounds.outputs.should_run == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install existing browser collector dependencies
        if: ${{ steps.bounds.outputs.should_run == 'true' }}
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-scrape.txt
          python -m playwright install --with-deps chromium

      - name: Validate ranked collection scaffold before shard run
        if: ${{ steps.bounds.outputs.should_run == 'true' }}
        shell: bash
        run: |
          set -euxo pipefail
          python scripts/validate_fortune_x_ranked_collection.py --allow-empty-before-run

      - name: Run ranked Fortune X shard collection
        if: ${{ steps.bounds.outputs.should_run == 'true' }}
        shell: bash
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
        run: |
          set -euo pipefail
          python scripts/run_fortune_x_ranked_collection.py \
            --start-rank "${{ steps.bounds.outputs.start_rank }}" \
            --end-rank "${{ steps.bounds.outputs.end_rank }}" \
            --max-posts "${{ inputs.max_posts }}" \
            --retries "${{ inputs.retry_attempts }}" \
            --max-scrolls "${{ inputs.max_scrolls }}" \
            --scroll-delay-seconds "${{ inputs.scroll_delay_seconds }}" \
            --idle-scroll-limit "${{ inputs.idle_scroll_limit }}" \
            --page-timeout-ms "${{ inputs.page_timeout_ms }}" \
            --previous-output-root ".previous_fortune_x_ranked" \
            --summary-file "data/audit/fortune_x_2025_ranked_collection_summary_shard_${{ matrix.shard.id }}.csv"

      - name: Stage shard artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging/data/raw staging/data/audit
          # Only copy if directory exists (might be empty if all skipped)
          if [ -d data/raw/fortune_x_2025_ranked ]; then
            cp -R data/raw/fortune_x_2025_ranked staging/data/raw/
          fi
          if [ -f "data/audit/fortune_x_2025_ranked_collection_summary_shard_${{ matrix.shard.id }}.csv" ]; then
            cp "data/audit/fortune_x_2025_ranked_collection_summary_shard_${{ matrix.shard.id }}.csv" staging/data/audit/
          fi

      - name: Upload shard artifact
        uses: actions/upload-artifact@v4
        with:
          name: fortune-x-ranked-shard-${{ matrix.shard.id }}
          path: staging/
          retention-days: 1

  aggregate-ranked-shards:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: collect-ranked-shards

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: fortune-x-ranked-shard-*
          path: artifact_downloads
          merge-multiple: true

      - name: Materialize downloaded shard artifacts
        shell: bash
        run: |
          set -euxo pipefail
          # Clear existing raw output to avoid stale results or collisions
          rm -rf data/raw/fortune_x_2025_ranked
          mkdir -p data/raw data/audit
          if [ -d artifact_downloads/data/raw/fortune_x_2025_ranked ]; then
            cp -R artifact_downloads/data/raw/fortune_x_2025_ranked data/raw/
          fi
          # Summary shards are individual files, copy them all
          if [ -d artifact_downloads/data/audit ]; then
            cp artifact_downloads/data/audit/fortune_x_2025_ranked_collection_summary_shard_*.csv data/audit/ || true
          fi

      - name: Merge shard summaries
        shell: bash
        run: |
          set -euxo pipefail
          python scripts/merge_fortune_x_ranked_collection_shards.py \
            --output data/audit/fortune_x_2025_ranked_collection_summary.csv

      - name: Validate ranked collection outputs
        shell: bash
        run: |
          set -euxo pipefail
          python scripts/validate_fortune_x_ranked_collection.py \
            --summary-file data/audit/fortune_x_2025_ranked_collection_summary.csv \
            --expected-start-rank "${{ inputs.start_rank }}" \
            --expected-end-rank "${{ inputs.end_rank }}"
          if [ -n "$(git status --short dashboard/data)" ]; then
            echo "::error title=dashboard/data changed::dashboard/data must not be modified by ranked collection."
            git status --short dashboard/data
            exit 1
          fi

      - name: Commit and push collection outputs
        if: ${{ inputs.commit_results == 'true' }}
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/fortune_x_2025_ranked data/audit/fortune_x_2025_ranked_collection_summary.csv
          if git diff --cached --quiet; then
            echo "No ranked Fortune X collection output changes to commit."
            exit 0
          fi
          git commit -m "data: collect ranked fortune x posts" -m "Collected browser-based observable public posts for the Fortune 2025 ranked queue using 25 matrix shards. Dashboard data was not synced. Official X API was not used."
          git push origin HEAD:main
