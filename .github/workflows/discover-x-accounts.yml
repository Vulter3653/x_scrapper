name: Discover Fortune X Accounts

on:
  workflow_dispatch:
    inputs:
      input_file:
        description: 'Firm master CSV input. Keep the sample file until the Fortune 100 master is manually verified.'
        required: true
        default: 'config/fortune100_firm_master_sample.csv'
        type: string
      firm_limit:
        description: 'Maximum firms to process. 0 means all rows in the input file and prints a warning.'
        required: true
        default: '10'
        type: string
      discovery_max_results:
        description: 'Maximum X user-search candidates retained per query.'
        required: true
        default: '10'
        type: string
      discovery_scrolls:
        description: 'Scroll attempts per X user-search query.'
        required: true
        default: '3'
        type: string
      discovery_delay_seconds:
        description: 'Delay between browser interactions.'
        required: true
        default: '1.25'
        type: string
      profile_details:
        description: 'Open candidate profile pages to enrich bio, external URL, followers, and verified status.'
        required: true
        default: true
        type: boolean
      backup_existing:
        description: 'Create .bak output files before deterministic regeneration.'
        required: true
        default: true
        type: boolean
      commit_results:
        description: 'Commit and push discovery CSV outputs. Keep false until artifacts are reviewed.'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  discover-x-accounts:
    name: Discover and audit X account candidates
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Install browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-scrape.txt
          python -m playwright install --with-deps chromium

      - name: 4. Validate discovery script
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/discover_x_account_candidates.py
          python scripts/discover_x_account_candidates.py --help

      - name: 5. Record credential and scope warnings
        id: preflight
        shell: bash
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          INPUT_FILE: ${{ inputs.input_file }}
          FIRM_LIMIT: ${{ inputs.firm_limit }}
        run: |
          set -euo pipefail
          test -f "$INPUT_FILE"
          if [ -n "${X_AUTH_TOKEN:-}" ] && [ -n "${X_CT0:-}" ]; then
            echo "credentials_present=yes" >> "$GITHUB_OUTPUT"
          else
            echo "credentials_present=no" >> "$GITHUB_OUTPUT"
            echo "::warning title=Missing X credentials::X_AUTH_TOKEN or X_CT0 is not configured. Discovery will generate missing_credentials audit rows without network search."
          fi
          if [ "$FIRM_LIMIT" = "0" ]; then
            echo "::warning title=Full input scope selected::firm_limit=0 processes every row in the input CSV. Fortune 100 full execution is not approved yet."
          fi

      - name: 6. Run Fortune X account discovery
        shell: bash
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          HEADLESS: 'true'
          DISCOVERY_MAX_RESULTS: ${{ inputs.discovery_max_results }}
          DISCOVERY_SCROLLS: ${{ inputs.discovery_scrolls }}
          DISCOVERY_DELAY_SECONDS: ${{ inputs.discovery_delay_seconds }}
          INPUT_FILE: ${{ inputs.input_file }}
          FIRM_LIMIT: ${{ inputs.firm_limit }}
          PROFILE_DETAILS: ${{ inputs.profile_details }}
          BACKUP_EXISTING: ${{ inputs.backup_existing }}
        run: |
          set -euo pipefail
          args=(
            --input "$INPUT_FILE"
            --firm-limit "$FIRM_LIMIT"
            --output config/fortune100_account_candidates.csv
            --recommendations data/audit/x_account_discovery_recommendations.csv
            --audit data/audit/x_account_discovery_audit.csv
          )
          if [ "$PROFILE_DETAILS" != "true" ]; then
            args+=(--no-profile-details)
          fi
          if [ "$BACKUP_EXISTING" = "true" ]; then
            args+=(--backup-existing)
          fi
          python scripts/discover_x_account_candidates.py "${args[@]}"

      - name: 7. Validate CSV outputs
        shell: bash
        env:
          INPUT_FILE: ${{ inputs.input_file }}
          FIRM_LIMIT: ${{ inputs.firm_limit }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import os
          from pathlib import Path

          input_file = Path(os.environ['INPUT_FILE'])
          firm_limit = int(os.environ['FIRM_LIMIT'])
          with input_file.open(encoding='utf-8', newline='') as handle:
              input_rows = list(csv.DictReader(handle))
          expected = len(input_rows) if firm_limit == 0 else min(firm_limit, len(input_rows))

          paths = {
              'candidates': Path('config/fortune100_account_candidates.csv'),
              'recommendations': Path('data/audit/x_account_discovery_recommendations.csv'),
              'audit': Path('data/audit/x_account_discovery_audit.csv'),
          }
          loaded = {}
          for name, path in paths.items():
              if not path.exists():
                  raise SystemExit(f'Missing output file: {path}')
              with path.open(encoding='utf-8', newline='') as handle:
                  reader = csv.DictReader(handle)
                  rows = list(reader)
              if not reader.fieldnames:
                  raise SystemExit(f'Missing CSV header: {path}')
              loaded[name] = rows
              print(f'{name}: rows={len(rows)} columns={len(reader.fieldnames)}')

          if len(loaded['recommendations']) != expected:
              raise SystemExit(f'Recommendation rows mismatch: expected={expected} actual={len(loaded["recommendations"])}')
          if not loaded['audit']:
              raise SystemExit('Audit output must contain at least one row.')
          print(f'CSV outputs validated: expected firms={expected}, candidate rows may be zero.')
          PY

      - name: 8. Guard against credential leakage
        shell: bash
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
        run: |
          set -euo pipefail
          files=(
            config/fortune100_account_candidates.csv
            data/audit/x_account_discovery_recommendations.csv
            data/audit/x_account_discovery_audit.csv
          )
          if grep -RniE '(auth_token|ct0)[[:space:]]*[:=]' "${files[@]}"; then
            echo "::error title=Credential key leakage::Discovery output contains a forbidden credential assignment."
            exit 1
          fi
          if [ -n "${X_AUTH_TOKEN:-}" ]; then
            if OUTPUT_FILES="${files[*]}" python - <<'PY'
          import os
          from pathlib import Path

          needle = os.environ['X_AUTH_TOKEN']
          files = os.environ['OUTPUT_FILES'].split()
          raise SystemExit(0 if any(needle in Path(path).read_text(encoding='utf-8', errors='ignore') for path in files) else 1)
          PY
            then
              echo "::error title=Credential value leakage::Discovery output contains the auth token value."
              exit 1
            fi
          fi
          if [ -n "${X_CT0:-}" ]; then
            if OUTPUT_FILES="${files[*]}" python - <<'PY'
          import os
          from pathlib import Path

          needle = os.environ['X_CT0']
          files = os.environ['OUTPUT_FILES'].split()
          raise SystemExit(0 if any(needle in Path(path).read_text(encoding='utf-8', errors='ignore') for path in files) else 1)
          PY
            then
              echo "::error title=Credential value leakage::Discovery output contains the ct0 value."
              exit 1
            fi
          fi
          echo "Credential leakage guard passed."

      - name: 9. Upload discovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: fortune-x-account-discovery
          path: |
            config/fortune100_account_candidates.csv
            data/audit/x_account_discovery_recommendations.csv
            data/audit/x_account_discovery_audit.csv
            docs/x_account_discovery_method.md
          retention-days: 7

      - name: 10. Commit discovery outputs
        if: ${{ inputs.commit_results }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git add \
            config/fortune100_account_candidates.csv \
            data/audit/x_account_discovery_recommendations.csv \
            data/audit/x_account_discovery_audit.csv
          if git diff --cached --quiet; then
            echo "No discovery output changes to commit."
            exit 0
          fi
          git commit -m "Update Fortune X account discovery outputs"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push failed on attempt ${attempt}; rebasing onto origin/main and retrying."
            git fetch origin main
            git rebase origin/main
          done
          echo "::error title=Discovery output push failed::Unable to push discovery outputs after retries."
          exit 1

      - name: 11. Write workflow summary
        if: always()
        shell: bash
        env:
          INPUT_FILE: ${{ inputs.input_file }}
          FIRM_LIMIT: ${{ inputs.firm_limit }}
          COMMIT_RESULTS: ${{ inputs.commit_results }}
          CREDENTIALS_PRESENT: ${{ steps.preflight.outputs.credentials_present }}
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv
          import os
          from collections import Counter
          from pathlib import Path

          def read_rows(path):
              file = Path(path)
              if not file.exists():
                  return []
              with file.open(encoding='utf-8', newline='') as handle:
                  return list(csv.DictReader(handle))

          candidates = read_rows('config/fortune100_account_candidates.csv')
          recommendations = read_rows('data/audit/x_account_discovery_recommendations.csv')
          audits = read_rows('data/audit/x_account_discovery_audit.csv')
          recommendation_counts = Counter(row.get('recommendation_status', '') for row in recommendations)
          audit_counts = Counter(row.get('status', '') for row in audits)

          print('# Fortune X Account Discovery Summary')
          print()
          print(f"- Input file: `{os.environ.get('INPUT_FILE', '')}`")
          print(f"- Firm limit: `{os.environ.get('FIRM_LIMIT', '')}`")
          print(f"- Candidates rows: `{len(candidates)}`")
          print(f"- Recommendations rows: `{len(recommendations)}`")
          print(f"- Audit rows: `{len(audits)}`")
          print(f"- Recommendation status counts: `{dict(recommendation_counts)}`")
          print(f"- Audit status counts: `{dict(audit_counts)}`")
          print(f"- Credentials present: `{os.environ.get('CREDENTIALS_PRESENT', 'no')}`")
          print(f"- Committed results: `{os.environ.get('COMMIT_RESULTS', 'false')}`")
          if os.environ.get('FIRM_LIMIT') == '0':
              print()
              print('> Warning: `firm_limit=0` selected all input firms. Fortune 100 full execution is not approved yet.')
          PY

