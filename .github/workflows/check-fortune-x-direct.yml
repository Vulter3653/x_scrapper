name: Check Fortune 2025 Direct X Profiles

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/check-fortune-x-direct.yml'
  workflow_dispatch:
    inputs:
      rank_limit:
        description: 'Highest Fortune rank to check. Default is 100 for stability.'
        required: true
        default: '100'
      timeout_ms:
        description: 'Playwright page timeout per profile URL.'
        required: true
        default: '30000'
      delay_ms:
        description: 'Wait after page load before classification.'
        required: true
        default: '1500'
      commit_results:
        description: 'Commit generated CSV/audit results back to main.'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  direct-check:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
      X_CT0: ${{ secrets.X_CT0 }}
      HEADLESS: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-scrape.txt
          python -m playwright install --with-deps chromium

      - name: Validate script
        shell: bash
        run: |
          set -euxo pipefail
          python -m py_compile scripts/check_fortune2025_x_direct_profiles.py
          python scripts/check_fortune2025_x_direct_profiles.py --help

      - name: Run direct X profile check
        shell: bash
        run: |
          set -euxo pipefail
          python scripts/check_fortune2025_x_direct_profiles.py \
            --rank-limit '${{ github.event_name == 'workflow_dispatch' && inputs.rank_limit || '100' }}' \
            --timeout-ms '${{ github.event_name == 'workflow_dispatch' && inputs.timeout_ms || '30000' }}' \
            --delay-ms '${{ github.event_name == 'workflow_dispatch' && inputs.delay_ms || '1500' }}'

      - name: Validate generated CSV files
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import csv
          from collections import Counter
          from pathlib import Path
          expected = int('${{ github.event_name == 'workflow_dispatch' && inputs.rank_limit || '100' }}')
          paths = [
              Path('config/fortune2025_top100_x_direct_check.csv'),
              Path('config/fortune2025_top100_x_account_index.csv'),
              Path('data/audit/fortune2025_top100_x_direct_profile_audit.csv'),
          ]
          for path in paths:
              if not path.exists():
                  raise SystemExit(f'Missing generated file: {path}')
              with path.open(encoding='utf-8', newline='') as f:
                  rows = list(csv.DictReader(f))
              print(path, 'rows=', len(rows))
              if len(rows) != expected:
                  raise SystemExit(f'Unexpected row count for {path}: {len(rows)} != {expected}')
              if rows and 'direct_check_status' in rows[0]:
                  print('direct_check_status', Counter(row['direct_check_status'] for row in rows))
              if rows and 'status' in rows[0]:
                  print('audit_status', Counter(row['status'] for row in rows))
          PY

      - name: Upload direct check artifact
        uses: actions/upload-artifact@v4
        with:
          name: fortune-2025-direct-x-profile-check
          path: |
            config/fortune2025_top100_x_direct_check.csv
            config/fortune2025_top100_x_account_index.csv
            data/audit/fortune2025_top100_x_direct_profile_audit.csv
          retention-days: 7

      - name: Commit and push results
        if: ${{ github.event_name == 'push' || inputs.commit_results == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          if [ -z "$(git status --porcelain)" ]; then
            echo 'No changes to commit.'
            exit 0
          fi

          git add config/fortune2025_top100_x_direct_check.csv \
                  config/fortune2025_top100_x_account_index.csv \
                  data/audit/fortune2025_top100_x_direct_profile_audit.csv
          git commit -m 'Update Fortune 2025 direct X profile check'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push failed on attempt ${attempt}; rebasing onto origin/main and retrying."
            git fetch origin main
            git rebase origin/main
          done

          echo 'Failed to push after retries.'
          exit 1

      - name: Write summary
        if: always()
        shell: bash
        env:
          RANK_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.rank_limit || '100' }}
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv
          from collections import Counter
          from pathlib import Path
          result = Path('config/fortune2025_top100_x_direct_check.csv')
          audit = Path('data/audit/fortune2025_top100_x_direct_profile_audit.csv')
          print('# Fortune 2025 Direct X Profile Check')
          print('')
          print(f'- Rank limit: {__import__("os").getenv("RANK_LIMIT", "")}')
          print(f'- Results file exists: {result.exists()}')
          print(f'- Audit file exists: {audit.exists()}')
          if result.exists():
              rows = list(csv.DictReader(result.open(encoding='utf-8', newline='')))
              print(f'- Result rows: {len(rows)}')
              print(f'- Check status counts: {dict(Counter(row.get("direct_check_status", "") for row in rows))}')
              print(f'- Profile exists counts: {dict(Counter(row.get("direct_profile_exists", "") for row in rows))}')
          if audit.exists():
              rows = list(csv.DictReader(audit.open(encoding='utf-8', newline='')))
              print(f'- Audit rows: {len(rows)}')
              print(f'- Audit status counts: {dict(Counter(row.get("status", "") for row in rows))}')
          PY
