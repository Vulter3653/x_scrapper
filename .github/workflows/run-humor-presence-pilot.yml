name: Run Humor Presence Pilot Classification

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Gemini model for humor presence pilot classification'
        required: true
        default: 'gemini-3.5-flash'
      batch_size:
        description: 'Batch size for classifier script'
        required: true
        default: '10'
      shard_count:
        description: 'Number of pilot shards'
        required: true
        default: '16'
      shard_size:
        description: 'Rows per shard'
        required: true
        default: '50'
      max_parallel:
        description: 'Maximum shard jobs to run in parallel'
        required: true
        default: '4'
      commit_results:
        description: 'Commit and push pilot classification outputs'
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

concurrency:
  group: humor-presence-pilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan-pilot-shards:
    runs-on: ubuntu-latest
    outputs:
      matrix_json: ${{ steps.plan.outputs.matrix_json }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
      input_rows: ${{ steps.plan.outputs.input_rows }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build shard matrix
        id: plan
        shell: bash
        env:
          SHARD_COUNT: ${{ inputs.shard_count }}
          SHARD_SIZE: ${{ inputs.shard_size }}
          PILOT_INPUT: data/derived/humor/humor_presence_pilot_sample.csv
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import json
          import os
          from pathlib import Path

          input_path = Path(os.environ["PILOT_INPUT"])
          shard_count = int(os.environ["SHARD_COUNT"])
          shard_size = int(os.environ["SHARD_SIZE"])
          if shard_count <= 0 or shard_size <= 0:
              raise SystemExit("shard_count and shard_size must be positive")
          if not input_path.exists():
              raise SystemExit(f"Pilot input file not found: {input_path}")

          with input_path.open(encoding="utf-8-sig", newline="") as handle:
              input_rows = sum(1 for _ in csv.DictReader(handle))

          capacity = shard_count * shard_size
          if input_rows <= 0:
              raise SystemExit("Pilot input has no data rows")
          if capacity < input_rows:
              raise SystemExit(f"Shard capacity {capacity} is smaller than input rows {input_rows}")

          include = []
          for shard_index in range(shard_count):
              start_row = shard_index * shard_size
              end_row = min(start_row + shard_size, input_rows)
              if start_row >= input_rows:
                  continue
              include.append({"shard_index": shard_index, "start_row": start_row, "end_row": end_row})

          matrix_json = json.dumps({"include": include}, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"matrix_json={matrix_json}\n")
              output.write(f"shard_count={len(include)}\n")
              output.write(f"input_rows={input_rows}\n")

          print(f"pilot_input_rows={input_rows}")
          print(f"planned_shards={len(include)}")
          print(f"shard_size={shard_size}")
          PY

  classify-pilot-shards:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: plan-pilot-shards
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.plan-pilot-shards.outputs.matrix_json) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify GEMINI_API_KEY presence
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          present = bool(os.environ.get("GEMINI_API_KEY"))
          print("GEMINI_API_KEY_present", present)
          if not present:
              raise SystemExit("GEMINI_API_KEY secret is missing")
          PY

      - name: py_compile
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/classify_humor_presence_zero_shot.py \
            scripts/validate_humor_presence_outputs.py \
            scripts/build_humor_presence_pilot_sample.py \
            scripts/build_humor_presence_pilot_shard.py \
            scripts/process_pilot_outputs.py

      - name: Build shard input
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_humor_presence_pilot_shard.py \
            --input data/derived/humor/humor_presence_pilot_sample.csv \
            --output "data/derived/humor/shards/humor_presence_pilot_sample_shard_${{ matrix.shard_index }}.csv" \
            --start-row "${{ matrix.start_row }}" \
            --end-row "${{ matrix.end_row }}"

      - name: Run shard humor presence classification
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          python scripts/classify_humor_presence_zero_shot.py \
            --input "data/derived/humor/shards/humor_presence_pilot_sample_shard_${{ matrix.shard_index }}.csv" \
            --output "data/derived/humor/shards/humor_presence_pilot_results_shard_${{ matrix.shard_index }}.csv" \
            --prompt config/prompts/humor_presence_zero_shot_prompt.md \
            --schema config/schemas/humor_presence_classification_output.schema.json \
            --provider gemini \
            --model "${{ inputs.model }}" \
            --api-key-env GEMINI_API_KEY \
            --batch-size "${{ inputs.batch_size }}" \
            --resume

      - name: Validate shard output
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_humor_presence_outputs.py \
            --input "data/derived/humor/shards/humor_presence_pilot_sample_shard_${{ matrix.shard_index }}.csv" \
            --output "data/derived/humor/shards/humor_presence_pilot_results_shard_${{ matrix.shard_index }}.csv"

      - name: Upload shard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: humor-presence-pilot-shard-${{ matrix.shard_index }}
          path: |
            data/derived/humor/shards/humor_presence_pilot_sample_shard_${{ matrix.shard_index }}.csv
            data/derived/humor/shards/humor_presence_pilot_results_shard_${{ matrix.shard_index }}.csv
          if-no-files-found: ignore
          retention-days: 2

  aggregate-pilot-results:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - plan-pilot-shards
      - classify-pilot-shards
    if: ${{ always() && needs.plan-pilot-shards.result == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: humor-presence-pilot-shard-*
          path: artifact_downloads
          merge-multiple: true

      - name: py_compile
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/classify_humor_presence_zero_shot.py \
            scripts/validate_humor_presence_outputs.py \
            scripts/build_humor_presence_pilot_sample.py \
            scripts/build_humor_presence_pilot_shard.py \
            scripts/process_pilot_outputs.py

      - name: Merge shard outputs and generate audit
        shell: bash
        run: |
          set -euo pipefail
          python scripts/process_pilot_outputs.py \
            --input data/derived/humor/humor_presence_pilot_sample.csv \
            --shard-results-root artifact_downloads \
            --output data/derived/humor/humor_presence_pilot_results.csv \
            --audit data/derived/humor/humor_presence_pilot_audit.csv \
            --review data/derived/humor/humor_presence_low_confidence_review_sample.csv \
            --model "${{ inputs.model }}" \
            --prompt config/prompts/humor_presence_zero_shot_prompt.md \
            --schema config/schemas/humor_presence_classification_output.schema.json

      - name: Validate final pilot output
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_humor_presence_outputs.py \
            --input data/derived/humor/humor_presence_pilot_sample.csv \
            --output data/derived/humor/humor_presence_pilot_results.csv

      - name: Print summary statistics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          from pathlib import Path
          audit_path = Path("data/derived/humor/humor_presence_pilot_audit.csv")
          with audit_path.open(encoding="utf-8-sig", newline="") as handle:
              stats = {row["audit_key"]: row["audit_value"] for row in csv.DictReader(handle)}
          print("--- PILOT SUMMARY STATISTICS ---")
          print(f"Total input rows: {stats.get('pilot_input_rows')}")
          print(f"Total output rows: {stats.get('pilot_output_rows')}")
          print(f"Shard result files: {stats.get('shard_result_files')}")
          print(f"Classified status: {stats.get('classification_status_classified')}")
          print(f"Failed status: {stats.get('classification_status_failed')}")
          print(f"Humor: {stats.get('humor_presence_humor')}")
          print(f"Non-humor: {stats.get('humor_presence_non_humor')}")
          print(f"Ambiguous: {stats.get('humor_presence_ambiguous')}")
          print(f"Needs Manual Review (True): {stats.get('needs_manual_review_true')}")
          print(f"Needs Manual Review (False): {stats.get('needs_manual_review_false')}")
          print(f"Wendy's humor rate: {float(stats.get('wendys_humor_rate', 0))*100:.2f}%")
          print(f"MoonPie humor rate: {float(stats.get('moonpie_humor_rate', 0))*100:.2f}%")
          print(f"Fortune Top 100 humor rate: {float(stats.get('fortune_top100_humor_rate', 0))*100:.2f}%")
          print(f"Wendy's ambiguous rate: {float(stats.get('wendys_ambiguous_rate', 0))*100:.2f}%")
          print(f"MoonPie ambiguous rate: {float(stats.get('moonpie_ambiguous_rate', 0))*100:.2f}%")
          print(f"Fortune Top 100 ambiguous rate: {float(stats.get('fortune_top100_ambiguous_rate', 0))*100:.2f}%")
          PY

      - name: Check forbidden mutations
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          for path in dashboard/data data/raw data/audit; do
            if [ -n "$(git status --short "$path")" ]; then
              echo "FAIL: Forbidden mutation detected in $path"
              git status --short "$path"
              exit 1
            fi
          done
          grep -R "api.x.com\|api.twitter.com\|Authorization: Bearer" scripts config data/derived/humor .github/workflows/run-humor-presence-pilot.yml || true

      - name: Upload final result files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: humor-presence-pilot-results
          path: |
            data/derived/humor/humor_presence_pilot_results.csv
            data/derived/humor/humor_presence_pilot_audit.csv
            data/derived/humor/humor_presence_low_confidence_review_sample.csv
          retention-days: 7

      - name: Commit and push outputs
        if: ${{ inputs.commit_results }}
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            data/derived/humor/humor_presence_pilot_results.csv \
            data/derived/humor/humor_presence_pilot_audit.csv \
            data/derived/humor/humor_presence_low_confidence_review_sample.csv
          if git diff --cached --quiet; then
            echo "No pilot output changes to commit."
            exit 0
          fi
          git commit -m "feat: run humor presence pilot classification"
          git push origin HEAD:main
