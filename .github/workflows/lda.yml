name: Run LDA Analysis

on:
  workflow_dispatch:
    inputs:
      target_user:
        description: 'X screen name whose data/<account>/posts.json should be analyzed'
        required: true
        default: 'Wendys'
      analysis_max_posts:
        description: '0 means analyze all posts; use a smaller number for faster test runs'
        required: true
        default: '0'
      lda_min_topics:
        description: 'Minimum candidate topic count for automatic selection'
        required: true
        default: '2'
      lda_max_topics:
        description: 'Maximum candidate topic count for automatic selection'
        required: true
        default: '12'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  lda:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-lda.txt

      - name: 4. Run LDA analysis
        shell: bash
        env:
          TARGET_USER: ${{ inputs.target_user }}
          ANALYSIS_MAX_POSTS: ${{ inputs.analysis_max_posts }}
          LDA_MIN_TOPICS: ${{ inputs.lda_min_topics }}
          LDA_MAX_TOPICS: ${{ inputs.lda_max_topics }}
        run: |
          set -o pipefail
          python analyze_posts.py --task lda 2>&1 | tee lda_analysis.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -n 60 lda_analysis.log
            last_error=$(tail -n 1 lda_analysis.log | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error title=LDA failed::$last_error"
            exit "$status"
          fi
          rm -f lda_analysis.log

      - name: 5. Sync dashboard data
        shell: bash
        run: |
          set -euxo pipefail
          python sync_dashboard_data.py

      - name: 6. Inspect changed files
        shell: bash
        run: |
          set -euxo pipefail
          git status --short

      - name: 7. Commit and push analysis results
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          if [ -z "$(git status --porcelain)" ]; then
            echo 'No changes to commit.'
            exit 0
          fi

          git add -A
          git commit -m "Update analysis results for ${{ inputs.target_user }}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push failed on attempt ${attempt}; rebasing onto origin/main and retrying."
            git fetch origin main
            git rebase origin/main
          done

          echo "Failed to push after retries."
          exit 1
