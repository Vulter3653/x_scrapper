name: Run Local Humor Presence Smoke

on:
  workflow_dispatch:
    inputs:
      pilot_rows:
        description: "Rows to classify for local smoke test"
        required: true
        default: "100"
      shard_size:
        description: "Size of each shard"
        required: true
        default: "50"
      max_parallel:
        description: "Maximum parallel shards"
        required: true
        default: "2"
      humor_threshold:
        description: "ML Humor Threshold"
        required: true
        default: "0.70"
      non_humor_threshold:
        description: "ML Non-Humor Threshold"
        required: true
        default: "0.30"
      classifier_version:
        description: "Classifier Version Tag"
        required: true
        default: "local-smoke-v2-github-actions"

permissions:
  contents: write
  actions: read

env:
  PILOT_ROWS: ${{ github.event.inputs.pilot_rows || '100' }}
  SHARD_SIZE: ${{ github.event.inputs.shard_size || '50' }}
  MAX_PARALLEL: ${{ github.event.inputs.max_parallel || '2' }}
  HUMOR_THRESHOLD: ${{ github.event.inputs.humor_threshold || '0.70' }}
  NON_HUMOR_THRESHOLD: ${{ github.event.inputs.non_humor_threshold || '0.30' }}

jobs:
  plan-local-smoke-shards:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Plan Shards
        id: plan
        run: |
          TOTAL=${{ env.PILOT_ROWS }}
          SIZE=${{ env.SHARD_SIZE }}
          NUM_SHARDS=$(( (TOTAL + SIZE - 1) / SIZE ))
          SHARDS=$(seq 1 $NUM_SHARDS | jq -R -s -c 'split("\n")[:-1]')
          echo "shards=$SHARDS" >> $GITHUB_OUTPUT

  classify-local-smoke-shards:
    needs: plan-local-smoke-shards
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: ${{ fromJson(needs.plan-local-smoke-shards.outputs.shards) }}
      max-parallel: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install scikit-learn pandas

      - name: Build HSQ-derived training seed
        run: |
          python scripts/build_humor_presence_training_seed.py \
            --output data/derived/humor/humor_presence_training_seed.csv

      - name: Build Samples and Shard
        run: |
          python scripts/build_humor_presence_pilot_sample.py \
            --output data/derived/humor/humor_presence_local_smoke_sample.csv \
            --fortune-n 60 --wendys-n 20 --moonpie-n 20
          
          START=$(( (${{ matrix.shard }} - 1) * ${{ env.SHARD_SIZE }} ))
          END=$(( ${{ matrix.shard }} * ${{ env.SHARD_SIZE }} ))
          
          head -n 1 data/derived/humor/humor_presence_local_smoke_sample.csv > shard_${{ matrix.shard }}.csv
          tail -n +2 data/derived/humor/humor_presence_local_smoke_sample.csv | sed -n "$((START+1)),${END}p" >> shard_${{ matrix.shard }}.csv

      - name: Classify Shard
        run: |
          python scripts/classify_humor_presence_local.py \
            --input shard_${{ matrix.shard }}.csv \
            --output data/derived/humor/humor_presence_local_smoke_results_shard_${{ matrix.shard }}.csv \
            --training-seed data/derived/humor/humor_presence_training_seed.csv \
            --cues config/humor_presence_rule_cues.json

      - name: Upload Shard Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smoke-shard-${{ matrix.shard }}
          path: data/derived/humor/humor_presence_local_smoke_results_shard_${{ matrix.shard }}.csv

  aggregate-local-smoke-results:
    needs: classify-local-smoke-shards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download all shards
        uses: actions/download-artifact@v4
        with:
          path: shards
          pattern: smoke-shard-*
          merge-multiple: true

      - name: Aggregate
        run: |
          OUT="data/derived/humor/humor_presence_local_smoke_results.csv"
          first=true
          for f in shards/*.csv; do
            if [ "$first" = true ]; then
              cat "$f" > "$OUT"
              first=false
            else
              tail -n +2 "$f" >> "$OUT"
            fi
          done

      - name: Upload Aggregated Results
        uses: actions/upload-artifact@v4
        with:
          name: humor-presence-local-smoke-aggregated
          path: data/derived/humor/humor_presence_local_smoke_results.csv

  evaluate-local-smoke-results:
    needs: aggregate-local-smoke-results
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Download Aggregated Results
        uses: actions/download-artifact@v4
        with:
          name: humor-presence-local-smoke-aggregated
          path: data/derived/humor/

      - name: Evaluate
        run: |
          python scripts/evaluate_humor_presence_local_pilot.py \
            --input data/derived/humor/humor_presence_local_smoke_results.csv \
            --output-audit data/audit/humor_presence_local_smoke_audit_summary.csv \
            --output-review-sample data/audit/humor_presence_local_smoke_review_sample.csv \
            --mode smoke \
            --sample-size ${{ env.PILOT_ROWS }} \
            --humor-threshold ${{ env.HUMOR_THRESHOLD }} \
            --non-humor-threshold ${{ env.NON_HUMOR_THRESHOLD }}

      - name: Upload Evaluation Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: humor-presence-local-smoke-evaluation
          path: |
            data/audit/humor_presence_local_smoke_audit_summary.csv
            data/audit/humor_presence_local_smoke_review_sample.csv
